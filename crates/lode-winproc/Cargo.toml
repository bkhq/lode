[package]
name = "lode-winproc"
description = "The Win32 process-control call lode's supervisor needs that has no safe wrapper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The workspace forbids unsafe code. This crate exists to hold the one FFI call
# the Windows supervisor needs, so it denies unsafe instead and allows that call.
[lints.rust]
warnings = { level = "deny", priority = -2 }
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
