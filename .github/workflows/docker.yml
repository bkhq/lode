name: docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose assets to package (e.g. v0.1.0)"
        required: true
      # `latest` is opt-in. This workflow is manual-dispatch only and can be run
      # for ANY existing release tag (e.g. rebuilding an old version), so there
      # is no "newest tag" push path to auto-detect — unconditionally retagging
      # `latest` would move it backwards when dispatching for an old tag.
      # Default false: check the box only when publishing the newest release.
      tag_latest:
        description: "Also move the `latest` tag to this image"
        type: boolean
        default: false

env:
  IMAGE_NAME: bkhq/lode

jobs:
  push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download lode binaries from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -eu
          mkdir -p docker-context/linux-amd64 docker-context/linux-arm64 release-assets
          gh release download "$TAG" \
            --pattern 'lode-linux-x64.tar.gz' \
            --pattern 'lode-linux-x64.tar.gz.sig' \
            --pattern 'lode-linux-arm64.tar.gz' \
            --pattern 'lode-linux-arm64.tar.gz.sig' \
            --dir release-assets

      # Nothing goes into the image unverified: each tarball must carry a `.sig`
      # that validates — for the app `lode` and the version the tag names —
      # against a key in crates/lode/release-keys.txt. The verifier is a
      # `lode-cli` built from this checkout, never the binary under test, so a
      # replaced release asset cannot vouch for itself. (A release uploaded with
      # allow_unsigned=true therefore cannot be packaged as an image.)
      - name: Build the verifier
        run: |
          set -eu
          cargo build --locked -p lode
          ln -sf lode target/debug/lode-cli

      - name: Verify release signatures
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -eu
          mapfile -t keys < <(grep -Ev '^[[:space:]]*(#|$)' crates/lode/release-keys.txt)
          [ "${#keys[@]}" -gt 0 ] || { echo "::error::no release keys in crates/lode/release-keys.txt" >&2; exit 1; }
          for f in lode-linux-x64.tar.gz lode-linux-arm64.tar.gz; do
            [ -s "release-assets/$f.sig" ] || { echo "::error::$f has no .sig sidecar on release $TAG" >&2; exit 1; }
            sig=$(tr -d '[:space:]' < "release-assets/$f.sig")
            ok=0
            for key in "${keys[@]}"; do
              if target/debug/lode-cli verify "release-assets/$f" \
                   --app lode --version "${TAG#v}" --pubkey "$key" --sig "$sig"; then
                ok=1
                break
              fi
            done
            [ "$ok" = 1 ] || { echo "::error::$f: signature does not verify against any release key" >&2; exit 1; }
            echo "verified $f"
          done

      - name: Unpack verified binaries
        run: |
          set -eu
          tar -xzf release-assets/lode-linux-x64.tar.gz   -C docker-context/linux-amd64
          tar -xzf release-assets/lode-linux-arm64.tar.gz -C docker-context/linux-arm64
          cp Dockerfile docker-context/Dockerfile
          ls -laR docker-context/

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # `latest` is gated behind the tag_latest input (see `on:` above) so a
          # dispatch for an old release tag cannot move `latest` backwards.
          flavor: |
            latest=${{ inputs.tag_latest }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}

      # The slim and mini variants get the same tags with a `-slim` / `-mini`
      # suffix (`v0.1.0-slim`, and `latest-slim` when tag_latest is set).
      - name: Docker meta (slim)
        id: meta-slim
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ inputs.tag_latest }}
            suffix=-slim,onlatest=true
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}

      - name: Docker meta (mini)
        id: meta-mini
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ inputs.tag_latest }}
            suffix=-mini,onlatest=true
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-context
          file: docker-context/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push (slim)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-context
          file: docker-context/Dockerfile
          target: slim
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim
          provenance: true
          sbom: true

      - name: Build and push (mini)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-context
          file: docker-context/Dockerfile
          target: mini
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-mini.outputs.tags }}
          labels: ${{ steps.meta-mini.outputs.labels }}
          cache-from: type=gha,scope=mini
          cache-to: type=gha,mode=max,scope=mini
          provenance: true
          sbom: true
