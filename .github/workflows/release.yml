name: Release

# Builds per-platform binaries and UPLOADS them to a GitHub Release.
#
# Triggered when a Release is *published* on GitHub (which creates the tag
# server-side) — NOT by pushing a tag. So you cut a release entirely on the
# remote (`gh release create vX.Y.Z …` or the GitHub UI) and this workflow
# attaches the binaries; a local `git push --tags` never triggers a build.
#
# Packaging:
#   Unix:    lode-<subpkg>.tar.gz       (contains ./lode + a ./lode-cli symlink)
#            lode-<subpkg>.tar.gz.sig   (its publisher signature, when signed)
#   Windows: lode-windows-x64.zip       (contains lode.exe + lode-cli.exe, the same program twice)
#            lode-windows-x64.zip.sig
#
# Signatures ride as `.sig` sidecar assets, NOT as the asset label: GitHub shows a
# label in place of the filename, which turned the release page into a list of
# base64 blobs. lode's GitHub adapter reads the sidecar (a label still wins when
# present), and `lode-cli self-update` verifies lode's own releases through it.
#
# Windows differs in how the app is contained and stopped (Job Object,
# CTRL_BREAK); see docs/operations.md.
#
# Docker images are built and pushed to Docker Hub by the separate `docker.yml`
# workflow (manual dispatch with the release tag).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload assets for (e.g. v0.1.0)"
        required: true
      allow_unsigned:
        description: "Allow uploading UNSIGNED assets when LODE_SIGNING_KEY is not set (release-published runs always fail loud)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # The release tag drives both the checkout ref and the upload target.
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  build-linux:
    name: build linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
            subpkg: linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04-arm
            subpkg: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --profile dist --target ${{ matrix.target }} --locked

      - name: Package tarball
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/dist/lode" "lode"
          chmod +x "lode"
          # lode is a multi-call binary; ship a `lode-cli` symlink that enables the
          # operator/publisher subcommands (the loader `lode` has none).
          ln -sf lode "lode-cli"
          tar -czf "dist/lode-${{ matrix.subpkg }}.tar.gz" "lode" "lode-cli"
          rm "lode" "lode-cli"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-${{ matrix.subpkg }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: build macos (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-26-intel
            subpkg: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-26
            subpkg: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --profile dist --target ${{ matrix.target }} --locked

      - name: Package tarball
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/dist/lode" "lode"
          chmod +x "lode"
          # lode is a multi-call binary; ship a `lode-cli` symlink that enables the
          # operator/publisher subcommands (the loader `lode` has none).
          ln -sf lode "lode-cli"
          tar -czf "dist/lode-${{ matrix.subpkg }}.tar.gz" "lode" "lode-cli"
          rm "lode" "lode-cli"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-${{ matrix.subpkg }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: build windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    env:
      # aws-lc-sys: use its prebuilt assembly objects instead of requiring NASM.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --profile dist --target x86_64-pc-windows-msvc --locked

      - name: Package zip
        shell: bash
        run: |
          set -eu
          mkdir -p dist pkg
          cp target/x86_64-pc-windows-msvc/dist/lode.exe pkg/lode.exe
          # Windows has no symlink to ship: lode-cli.exe is a copy, and the
          # program picks its role from the name it was started under.
          cp pkg/lode.exe pkg/lode-cli.exe
          (cd pkg && 7z a -tzip ../dist/lode-windows-x64.zip lode.exe lode-cli.exe)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  upload:
    name: upload assets to the release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download all platform assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -la artifacts/

      - name: Generate SHA256SUMS
        run: |
          set -eu
          cd artifacts
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
          # A secret cannot be referenced in `if:`, so map it to an env var and
          # branch on the string at runtime. Unset -> the job FAILS unless the
          # run was dispatched with allow_unsigned=true (release-published runs
          # have no inputs, so they always fail loud when the key is missing).
          LODE_SIGNING_KEY: ${{ secrets.LODE_SIGNING_KEY }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          set -eu
          if [ -z "${LODE_SIGNING_KEY:-}" ] && [ "${ALLOW_UNSIGNED:-}" != "true" ]; then
            echo "::error::LODE_SIGNING_KEY is not set — refusing to upload unsigned release assets. Set the secret, or re-run via workflow_dispatch with allow_unsigned=true to opt out explicitly." >&2
            exit 1
          fi
          if [ -n "${LODE_SIGNING_KEY:-}" ]; then
            # Signing requested: make the `lode-cli` publisher toolkit available.
            # This job runs on ubuntu-26.04 (linux x64); extract the matching
            # static-musl binary from its own release tarball. lode is a multi-call
            # binary and the tarball already ships a `lode-cli` symlink, but
            # recreate it defensively if a future tarball ever omits it.
            mkdir -p bin
            tar -xzf artifacts/lode-linux-x64.tar.gz -C bin
            [ -e bin/lode-cli ] || ln -sf lode bin/lode-cli
            cli="$PWD/bin/lode-cli"
          fi
          for f in artifacts/*.tar.gz artifacts/*.zip; do
            if [ -n "${LODE_SIGNING_KEY:-}" ]; then
              # `lode-cli sign` prints `sha256:`, `sig:`, `key_id:` and `alg:` lines;
              # the base64 on the `sig:` line is the signature. It binds the app name
              # `lode-cli self-update` runs under (`lode`) and the version lode
              # derives from the tag — the tag minus its leading `v` — so sign
              # with that, never the raw tag. Publish it as the `<asset>.sig`
              # sidecar asset (see the header comment).
              "$cli" sign "$f" --app lode --version "${TAG#v}" --key-env LODE_SIGNING_KEY \
                | awk '/^sig:/ {print $2}' > "$f.sig"
              if [ ! -s "$f.sig" ]; then
                echo "::error::failed to obtain signature for $(basename "$f")" >&2
                exit 1
              fi
              gh release upload "$TAG" "$f" "$f.sig" --clobber
            else
              gh release upload "$TAG" "$f" --clobber
              echo "::warning::LODE_SIGNING_KEY not set — $(basename "$f") uploaded UNSIGNED (allow_unsigned=true)"
            fi
          done
          # Checksums over every archive uploaded above, for offline verification.
          gh release upload "$TAG" artifacts/SHA256SUMS --clobber
